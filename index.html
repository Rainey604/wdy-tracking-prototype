function scopeBlock(){return `<div class="scope"><b>指定商品</b><div class="radios"><label class="radio"><input type="radio" name="scope" value="all" checked>全部商品</label><label class="radio"><input type="radio" name="scope" value="category">指定类目</label><label class="radio"><input type="radio" name="scope" value="sku">指定SKU</label></div><div class="help" id="scopeHelp">可插入任意已授权京东商品。</div></div>`}
function bindScope(){$$('input[name="scope"]').forEach(x=>x.onchange=()=>{scope=x.value;$('#scopeHelp').textContent=scope==='sku'?'允许的 SKU：100150162535；已有条目将重新校验。':scope==='category'?'允许类目：手机通讯；无法解析范围的活动页将阻止保存。':'可插入任意已授权京东商品。';renderItems()})}
function editor(){let copy=current.includes('Reply')?'您好，您想了解的商品信息如下：':'欢迎您，很高兴为您服务。';let normalLink=current==='friendWelcome'?'<button class="tool normal-link" id="normalLink">🔗 链接</button>':'';let friendSopPreview=current==='friendSop'&&planMode;if(friendSopPreview&&!items.length)items=[{sku:'100150162535'}];return `<div class="editor-grid"><div><div class="editor ${friendSopPreview?'sop-inline-editor':''}"><div class="editbox"><div class="editor-text">${copy}</div><div class="track-chip-wrap" id="chipWrap"></div><span class="count" id="textCount">${copy.length}/2000</span></div><div class="toolbar"><button class="tool">▱ 素材库</button><button class="tool">▧ 图片</button><button class="tool">▶ 视频</button><button class="tool">▤ 文件</button>${normalLink}<button class="tool">◎ 小程序</button><button class="tool track" id="addLink">插入转链接 <i class="new-badge">新增</i></button><button class="tool ai">✦AI 文案代写</button><span class="attach-count" id="attachCount">0/9</span></div><div class="items" id="items"></div></div><div class="callout rule">普通“链接”为原有附件能力；“插入转链接”用于订单归因，两者分别配置。</div></div><div><div class="phone ${friendSopPreview?'sop-phone':''}"><div class="phone-head">${friendSopPreview?'<span class="phone-back">‹</span>':''}内容预览<div class="help" id="previewCount">${friendSopPreview?'共1条消息':(current.includes('group')?'客户群消息':'好友消息')}</div></div><div class="phone-body" id="phoneBody"></div></div></div></div>`}
const originalEditor=editor;
editor=function(){return current==='friendWelcome'?friendWelcomeEditor():originalEditor()}
function bindEditor(){if($('#addLink'))$('#addLink').onclick=openLink;if($('#normalLink'))$('#normalLink').onclick=()=>toast('普通链接入口已保留（原有能力）');renderItems()}
function renderItems(){const wrap=$('#chipWrap');if(!wrap)return;wrap.innerHTML=items.map((it,i)=>{let bad=current==='scene'&&scope==='sku'&&it.sku!=='100150162535';return `<span class="track-chip ${bad?'invalid':''}" title="转链：${it.sku}"><span>🔗</span><span class="chip-text">转链：${it.sku}</span><button class="chip-del" data-del="${i}" title="删除">×</button></span>`}).join('');if($('#attachCount'))$('#attachCount').textContent='0/9';if($('#textCount')){let base=current==='moments'?17:(current.includes('Reply')?16:12),limit=current==='moments'?1000:2000;$('#textCount').textContent=`${base+items.reduce((n,x)=>n+3+x.sku.length,0)}/${limit}`}$$('[data-del]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);renderItems()});const p=$('#phoneBody');if(p){const friendSopPreview=current==='friendSop'&&planMode;if(friendSopPreview){p.innerHTML=`<div class="sop-msg-row"><div class="sop-msg">欢迎您，很高兴为您服务。${items.map(it=>`<span class="sop-inline-track" title="转链：${it.sku}">🔗 转链：${it.sku}</span>`).join('')}</div><div class="sop-avatar">W</div></div>`;if($('#previewCount'))$('#previewCount').textContent='共1条消息'}else p.innerHTML=`<div class="bubble">${current.includes('Reply')?'您好，您想了解的商品信息如下：':'欢迎您，很高兴为您服务。'}</div>${items.map(it=>`<div class="bubble link"><b>🔗 转链：${it.sku}</b>推广短链接将在实际发送时生成</div>`).join('')}<div class="preview-note">预览不生成可点击的最终链接</div>`}const mp=$('#momentPreviewLinks');if(mp)mp.innerHTML=items.map(it=>`<div class="moment-link">🔗 转链：${it.sku}<br><span class="help">实际发布时生成推广短链</span></div>`).join('')}
function renderSop(){const group=current==='groupSop';if(sopStep===1){$('#drawerBody').innerHTML=`<div class="steps"><div class="step active"><b>1</b>设置基本信息</div><div class="line"></div><div class="step"><b>2</b>SOP计划</div></div><div class="section"><div class="section-title">基础设置</div>${row('SOP名称',input(group?'新客群培育SOP':'新客户培育SOP'))}${row(group?'触发群聊':'目标客户',select(group?'按群标签：新客群':'新客户'))}${row('执行员工',select(group?'可不选；实际发送前确定':'买买、小云'))}${group?row('角色优先级',input('群主 > 管理员 > 在线员工')):row('添加时间',input('最近30天'))}${row('有效期',input('2026-08-27 ~ 2026-12-31'))}${row('免打扰时段','<span class="switch on"></span> 22:00 - 次日 08:00')}</div><div class="callout rule">第一步不增加转链入口。目标范围、去重、有效期、免打扰和员工判断均属于转链前置条件。</div>`;$('#saveDrawer').textContent='下一步';$('#saveDrawer').onclick=()=>{sopStep=2;renderSop()}}
 else if(!planMode){$('#drawerBody').innerHTML=`<div class="steps"><div class="step"><b>1</b>设置基本信息</div><div class="line"></div><div class="step active"><b>2</b>SOP计划</div></div>${group?'<div class="callout">预检查已通过：当前群聊与候选发送人匹配。此步骤不会生成最终短链，执行时将重新确定员工。</div>':''}<div class="head"><div><h1 style="font-size:16px">SOP计划</h1><p>每个计划独立配置发送内容和转链条目</p></div><button class="btn primary" id="addPlan">+ 添加计划</button></div><div class="plans"><div class="plan"><div><b>计划1 · 新客欢迎</b><div class="help">任务开始后 1 小时 · 含1条跟单链接</div></div><button class="btn text" id="editPlan">编辑</button></div><div class="plan"><div><b>计划2 · 商品推荐</b><div class="help">每周三 10:00 · 未配置跟单链接</div></div><button class="btn text">编辑</button></div></div><div class="callout rule">顶层计划列表不设置转链入口；转链入口只出现在新增或编辑计划的“发送内容”内。</div>`;$('#saveDrawer').textContent='保存草稿';$('#saveDrawer').onclick=()=>toast('草稿已保存（原型演示）');$('#addPlan').onclick=$('#editPlan').onclick=()=>{planMode=true;items=[];renderSop()}}
 else{$('#drawerBody').innerHTML=`<button class="btn text" id="backPlan">← 返回SOP计划</button><div class="section"><div class="section-title">计划设置</div>${row('计划名称',input('计划3 · 商品推荐'))}${row('发送类型',radios(['单次发送','每天','每周']))}${row('发送时间',select(group?'任务开始后 2 小时':'上一计划推送完成后'))}</div><div class="section"><div class="section-title">发送内容</div>${editor()}</div><div class="section"><div class="section-title">发送条件</div>${row(group?'群过滤条件':'客户条件',select(group?'群人数 ≥ 50人':'客户状态：未流失'))}${row('执行后更新标签',select(group?'群标签：已触达':'客户标签：已触达'))}</div>`;bindEditor();$('#backPlan').onclick=()=>{planMode=false;renderSop()};$('#saveDrawer').textContent='保存计划';$('#saveDrawer').onclick=()=>{toast('计划已保存；动态配置不会复用历史短链');planMode=false;renderSop()}}
}
function openLink(){if(items.length>=9){toast('内容/附件最多9条');return}prechecked=false;$('#linkInput').value='';$('#linkError').classList.remove('show');$('#linkResult').classList.remove('show');$('#sceneName').value=modules[current].scene+(planMode?' · SOP计划':'');$('#linkModal').classList.add('show')}
const originalRenderItems=renderItems;
renderItems=function(){originalRenderItems();if(current==='friendReply'){const p=$('#phoneBody');if(p){p.innerHTML=`<div class="sop-msg-row"><div class="sop-msg">您好，请查看这个链接${items.map(it=>`<span class="sop-inline-track" title="转链：${it.sku}">🔗 转链:${it.sku}</span>`).join('')}${items.length?'<i class="new-badge">新增</i>':''}</div><div class="sop-avatar">W</div></div>`;if($('#previewCount'))$('#previewCount').textContent='共1条消息'}}}
function closeLink(){ $('#linkModal').classList.remove('show') }
function valid(){let v=$('#linkInput').value.trim();return /^\d{6,}$/.test(v)||/^https?:\/\/(item\.)?jd\.com\//i.test(v)||/^https?:\/\/u\.jd\.com\//i.test(v)}
$('#precheck').onclick=()=>{if(!valid()){$('#linkError').classList.add('show');$('#linkResult').classList.remove('show');return}$('#linkError').classList.remove('show');$('#linkResult').classList.add('show');prechecked=true};
$('#insertLink').onclick=()=>{if(!valid()){ $('#linkError').classList.add('show');return}if(!prechecked){$('#precheck').click();return}let v=$('#linkInput').value.trim(),sku=/^\d+$/.test(v)?v:'100150162535';items.push({sku});closeLink();renderItems();toast('已插入转链：'+sku)};
$('#closeLink').onclick=$('#cancelLink').onclick=closeLink;$('#mask').onclick=closeDrawer;$('#closeDrawer').onclick=$('#cancelDrawer').onclick=closeDrawer;$('#saveDrawer').onclick=()=>toast('草稿已保存（原型演示）');
$$('.menu').forEach(b=>b.onclick=()=>{let key=b.dataset.module;if(key==='friendBulk'||key==='groupBulk'){toast('该模块已具备插入转链接能力，无需调整');return}if(key==='announcement'){toast('客户群公告无聊天式内容编辑器，无需调整');return}current=key;$$('.menu').forEach(x=>x.classList.toggle('active',x===b));page()});
$('#toggleRules').onclick=e=>{rulesOn=!rulesOn;e.target.textContent=`规则提示：${rulesOn?'开':'关'}`;e.target.classList.toggle('on',rulesOn);$$('.rule').forEach(x=>x.style.display=rulesOn?'block':'none')};
page();
</script>
</body>
</html>
